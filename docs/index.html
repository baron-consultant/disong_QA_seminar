<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>2분기 세미나 · Q&A 통합 관리 플랫폼</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090d14;color:#edf2f7;font-family:"Pretendard","Malgun Gothic",sans-serif;overflow:hidden}
    button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #a6f3c9;outline-offset:5px}
    .toolbar{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;background:#151d2aef;border:1px solid #344153;border-radius:12px;white-space:nowrap;font-size:13px}
    .toolbar button{background:#263247;border:0;padding:9px 13px;border-radius:6px}.toolbar button:hover{background:#3c506c}.toolbar button:disabled{opacity:.3;cursor:default}.toolbar span{padding:0 8px;color:#abb9cb}
    #stage{width:2560px;height:720px;position:absolute;top:50%;left:50%;transform-origin:center;display:grid;grid-template-columns:1fr 1fr;background:#0f1722;overflow:hidden}
    .narrative{padding:66px 78px;position:relative;display:flex;flex-direction:column;border-right:1px solid #344052}
    .eyebrow{color:#9bf0c0;font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.kicker{color:#8e9bb0;font-size:18px;margin-top:28px}
    h1{font-size:61px;line-height:1.23;letter-spacing:-2.8px;margin:19px 0 25px;word-break:keep-all;font-weight:750;max-width:1080px}
    .lead{font-size:27px;line-height:1.65;color:#c1cddd;max-width:1000px;word-break:keep-all;margin:0}
    .points{display:flex;gap:20px;margin-top:auto;padding-top:30px}.point{flex:1;border-top:2px solid #435168;padding-top:16px;font-size:20px;line-height:1.5;word-break:keep-all;color:#aebdd1}
    .footer{display:flex;justify-content:space-between;color:#697a90;font-size:14px;margin-top:35px;letter-spacing:.3px}
    .reference{background:#141f2e;padding:66px 70px;display:flex;flex-direction:column}.ref-label{font-size:15px;letter-spacing:2px;color:#9badc3;margin-bottom:18px}.ref-title{font-size:34px;font-weight:700;margin:0 0 28px;letter-spacing:-1px}.visual{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
    .card{border:1px solid #35465c;background:#1c2b3e;padding:23px 28px;border-radius:12px}.card strong{display:block;font-size:27px;font-weight:650;margin-bottom:8px;color:#e6edf6}.card p{font-size:21px;line-height:1.5;color:#afc0d5;margin:0;word-break:keep-all}.card.accent{border-color:#72d6a2;background:#193831}.card.accent strong{color:#a6f3c9}.card.warn{border-color:#bb9a63}.card.warn strong{color:#efd096}
    .row{display:flex;align-items:stretch;gap:14px}.row .card{flex:1;min-width:0}.arrow{color:#78d8a4;align-self:center;font-size:30px}.source{color:#8494a9;font-size:14px;line-height:1.6;margin-top:22px;overflow-wrap:anywhere}.status{color:#e5c78f;font-size:17px;margin-top:17px}
    #stage.wide{grid-template-columns:1.15fr 1fr}#stage.wide .narrative{border-right:0;padding-right:90px}#stage.wide .reference{background:transparent;padding-left:20px}#stage.wide h1{font-size:74px;max-width:1170px}#stage.wide .ref-label{visibility:hidden}
    .mode-hint{position:fixed;top:16px;left:22px;font-size:12px;color:#687a91}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    @media(max-width:650px){.toolbar{font-size:11px;gap:4px;padding:6px}.toolbar button{padding:8px}.toolbar span{padding:0 3px}.mode-hint{font-size:10px}}
    @media print{body{overflow:visible;background:white}#stage{position:static;transform:none!important;width:100%;height:auto;min-height:720px}.toolbar,.mode-hint{display:none}}
  </style>
</head>
<body>
  <div class="mode-hint">발표 구성 초안 · 자료 기준 2026.09.21 · 오른쪽은 실제 UI가 아닌 설명 도식</div>
  <main id="stage" aria-label="세미나 슬라이드">
    <section class="narrative">
      <div class="eyebrow">BARON / Q&A PLATFORM</div>
      <div class="kicker" id="chapter"></div>

      <p class="lead" id="lead"></p>
      <div class="points" id="points"></div>
      <div class="footer"><span>2분기 세미나 · 내용 검토용</span><span id="page"></span></div>
    </section>
    <aside class="reference" aria-label="설명 도식과 문서 근거">
      <div class="ref-label">REFERENCE / 문서 기반 설명</div>
      <h2 class="ref-title" id="ref-title"></h2>
      <div class="visual" id="visual"></div>
      <div class="status" id="status"></div>
      <div class="source" id="source"></div>
    </aside>
  </main>
  <nav class="toolbar" aria-label="발표 조작">
    <button id="prev" aria-label="이전 슬라이드">←</button>
    <span id="counter"></span>
    <button id="next" aria-label="다음 슬라이드">→</button>

    <button id="fullscreen">전체 화면 · F</button>
  </nav>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <script>
    const slides = [
      {chapter:'01 / INTRODUCTION',title:'흩어진 문의를\n하나의 처리 흐름으로',lead:'여러 서비스의 Q&A를 모아 담당자 배정부터 답변, 개발 이슈, 완료 확인까지 연결합니다.',points:['문의는 각 서비스에서','관리는 한곳에서','해결 과정은 끝까지'],ref:'Q&A 통합 관리 플랫폼',cards:[['서비스별 Q&A','사용자는 이용하던 서비스에서 문의를 남깁니다.'],['통합 관리','담당자·상태·답변·내부 협업을 한곳에서 관리합니다.','accent'],['해결과 안내','필요한 개발 작업을 연결하고 처리 결과를 안내합니다.']],source:'README · 프로젝트 개요 / 목표와 처리 흐름'},
      {chapter:'02 / WHY',title:'관리자는 여러 창구를\n확인해야 했습니다',lead:'문의와 처리 이력이 서비스별로 나뉘어 있으면, 누가 무엇을 처리하는지 한눈에 알기 어렵습니다.',points:['서비스마다 문의 확인','담당자와 답변 이력 분산','통합 현황 파악의 어려움'],ref:'기존 운영 → 통합 관리',cards:[['서비스별 분산','서비스 A · 서비스 B · 인트라넷의 문의와 답변'],['프로젝트 권한을 유지한 통합 조회','접수 · 담당자 · 상태 · 관련 이슈를 같은 기준으로 확인','accent'],['기대 효과','확인 동선 감소 · 문의 누락 방지 · 처리 이력 추적']],status:'기대 효과이며, 개선율을 측정한 성과 수치는 아닙니다.',source:'README · 통합 관리가 필요한 이유'},
      {chapter:'03 / CONCEPT',title:'서비스와 접수 창구를\n공통 구조로 연결합니다',lead:'프로젝트는 서비스 단위, 채널은 그 안의 접수 창구입니다. Q&A와 피드백은 같은 요청을 부르는 이름입니다.',points:['프로젝트 = 서비스','채널 = 세부 접수 창구','Q&A = 관리 대상 피드백'],ref:'플랫폼의 기본 단위',cards:[['프로젝트','예시: EG-BIM'],['채널','예시: 일반 문의 · 오류 문의 · 개선 요청'],['Q&A / 피드백','작성자·담당자·중요도·답변·메모·연결 이슈','accent']],status:'프로젝트·채널 이름은 구조 설명을 위한 예시입니다.',source:'관리페이지-개념설명 · 프로젝트와 채널 / Q&A와 피드백'},
      {chapter:'04 / USER JOURNEY',title:'사용자에게 중요한 것은\n접수됐다는 확신입니다',lead:'서비스에서 Q&A에 들어와 문의를 남기고, 접수 결과와 처리 상태를 확인하는 경험을 연결합니다.',points:['SSO 기반 진입','문의·첨부·비밀글','접수 번호와 상태 확인'],ref:'사용자의 문의 여정',cards:[['01  진입과 인증','서비스 Q&A 메뉴 → 중앙 SSO → 문의 화면'],['02  작성과 제출','제목 · 내용 · 구분 · 첨부파일 · 비밀글'],['03  접수 확인','등록 결과 → 상세 화면 → 답변과 상태 확인','accent']],status:'9월 21일 외부 작성 화면 문서에는 localStorage 테스트 모드가 명시돼 있습니다.',source:'EG-BIM Q&A 사용자 여정 맵 / 로그인부터 글 저장까지 전이맵'},
      {chapter:'05 / OPERATIONS',title:'처리할 일을\n한곳에서 확인합니다',lead:'프로젝트를 오가며 확인하던 피드백과 이슈를 통합 관리 화면에서 조회하고 담당자를 지정합니다.',points:['프로젝트·상태·기간 검색','내 담당 문의 확인','피드백과 이슈 처리'],ref:'관리자가 확인하는 정보',cards:[['어디서 들어왔나','프로젝트 · 채널 · 작성자 · 등록일'],['누가 처리하나','담당자 · 중요도 · 현재 상태','accent'],['어디까지 진행됐나','최근 업데이트 · 공개 답변 · 연결된 이슈']],status:'실제 통합 관리 화면 캡처를 배치할 자리입니다.',source:'README §5 / multi-project-admin-dashboard-design §11'},
      {chapter:'06 / COLLABORATION',title:'고객 답변과 내부 협업을\n같은 문의에 기록합니다',lead:'사용자에게 전달할 안내와 담당자 사이의 재현·검토·인수인계 기록을 구분합니다.',points:['답변은 작성자에게','메모는 내부 담당자에게','문의의 맥락은 이어서'],ref:'공개 범위가 다른 두 기록',rows:true,cards:[['공개 댓글 / 답변','확인 결과, 조치 내용, 추가 질문과 사용 안내','accent'],['담당자 내부 메모','오류 재현, 원인 추정, 담당자 간 협의와 인수인계']],status:'내부 메모는 사용자 화면과 일반 사용자 알림에서 제외합니다.',source:'관리페이지-운영팀-사용가이드 · 댓글과 내부 메모 구분하기'},
      {chapter:'07 / ISSUE TRACKING',title:'문의에서\n개발 작업까지 연결합니다',lead:'같은 원인의 여러 문의를 하나의 이슈로 묶고, 필요한 개발 작업을 Gitea와 연결합니다.',points:['여러 문의 → 같은 이슈','한 문의 → 여러 이슈','개발 결과와 문의 이력 연결'],ref:'피드백 ↔ 내부 이슈 ↔ Gitea',cards:[['피드백 A · 피드백 B','같은 원인으로 접수된 여러 문의'],['내부 이슈','관련 피드백을 묶어 작업 단위로 관리','accent'],['Gitea 개발 이슈','기존 이슈 검색·연결 또는 신규 생성']],status:'이슈 연결만으로 피드백이 완료되지는 않습니다.',source:'README · 이슈와 Gitea / 관리페이지-개념설명 §5, §9'},
      {chapter:'08 / COMPLETION',title:'작업 완료 뒤에도\n고객 안내가 남습니다',lead:'피드백과 이슈는 각각의 상태를 가집니다. 처리 완료 안내 뒤 작성자 확인 또는 확인 기간 만료를 거쳐 문의를 마무리합니다.',points:['신규 → 접수 → 진행중','필요하면 보류','안내와 확인 후 완료'],ref:'완료는 별도의 업무 절차',cards:[['연결된 이슈 처리','모든 관련 작업의 완료 여부를 확인'],['관리자 완료 안내','피드백은 진행중 유지 + 작성자 확인 대기','accent'],['작성자 확인 또는 기간 만료','조건을 확인하고 피드백 완료']],status:'5단계 상태 기준 · 확인 대기는 별도 상태값이 아닙니다.',source:'admin-console-integration-feedback-requirements-2026-09-02 §8–9'},
      {chapter:'09 / ARCHITECTURE',title:'사용자와 관리자가\n같은 원본을 봅니다',lead:'ABC API와 DB를 피드백의 기준으로 두고, 인증과 접근 제어, 운영 보조 기능을 연결합니다.',points:['BARON-SSO: 사용자 식별','ABC: 피드백 원본','Secretary: 업무 보조'],ref:'공통 데이터 기반',cards:[['사용자 화면 / 관리자 콘솔','같은 문의의 제목·내용·상태·답변 조회'],['ABC API + Secretary API','피드백·이슈 API와 접근·워크스페이스 보조 기능'],['MySQL userfeedback','ABC 원본 + Secretary 지원 테이블','accent']],status:'단일 DB 전환 문서 기준의 논리 구조입니다. 운영 적용 여부는 별도 확인 대상입니다.',source:'README §2–4 / ssot-feedback-rearchitecture-tasks / abc-single-database-migration-tasks'},
      {chapter:'10 / ENGINEERING',title:'다시 보내도\n같은 문의로 처리하도록',lead:'여러 접수 서비스에서 들어오는 요청을 일관되게 식별하고, 네트워크 재시도가 중복 등록으로 이어지지 않도록 설계했습니다.',points:['UUID v7 식별자','원본 키와 멱등 키','MySQL Unique 제약'],ref:'운영을 위한 기술 개선',cards:[['식별자','API는 UUID 문자열, DB는 BINARY(16)'],['중복 방지','같은 요청의 키를 유지하고 DB 제약으로 정합성 보장','accent'],['운영 경계','프로젝트 권한 · 공개 범위 · 삭제 이력 · Redis 장애 시 DB 처리']],status:'UUID 전환과 로컬 검증은 문서 기록 기준입니다. 샤딩은 향후 검토 항목입니다.',source:'uuidv7-first-distributed-design-and-task-list / local-userfeedback-erd / UUID 운영 런북'},
      {chapter:'11 / CURRENT & NEXT',title:'구현과 운영 연결을\n구분해서 완성합니다',lead:'핵심 관리 기능의 구현 기록을 바탕으로, 외부 작성 화면과 알림·데이터 이관의 실제 운영 연결을 확인해야 합니다.',points:['핵심 업무 기능 소개','실연동과 시연 환경 확인','외부 알림·업무 영역 확장'],ref:'문서 기준 진행 범위',cards:[['구현 기록','통합 관리 · 담당자 · 내부 메모 · Gitea · UUID 전환','accent'],['실연동 확인','외부 작성 API · 네이버웍스 실발송 · 운영 이관','warn'],['후속 확장','카카오톡·SMS · 신청·결재·자산·차량 지원']],status:'기능 소개 자료이며 전체 운영 완료를 의미하지 않습니다.',source:'9월 21일 전이맵 §4, §7.4 / 알림 작업 문서 / 제품 배포 및 이관 실행계획'},
      {chapter:'12 / DISCUSSION',title:'문의가 들어온 순간부터\n해결을 확인할 때까지',lead:'서비스별 문의, 운영팀의 응대, 개발자의 작업, 사용자 안내를 하나의 이력으로 연결하는 것이 이 플랫폼의 목적입니다.',points:['접수의 일관성','처리의 가시성','해결 과정의 추적성'],ref:'Q&A',cards:[['사용자','내 문의가 접수됐고 어떻게 처리되는지 확인'],['운영팀','누가 어떤 요청을 처리해야 하는지 확인'],['개발팀','어떤 문의 때문에 작업하는지 확인','accent']],status:'다음 편집: 실제 제품 화면 · 시연 환경 · 발표 시간 · 성과 기간 확정',source:'문서 검토 종합 · notes/content-review.md / notes/storyboard.md'}
    ];
    const $=id=>document.getElementById(id);
    let page=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1));
    let wide=false;
    function makeCard(data){const div=document.createElement('div');div.className='card '+(data[2]||'');const strong=document.createElement('strong');strong.textContent=data[0];const p=document.createElement('p');p.textContent=data[1];div.append(strong,p);return div}
    function render(){const s=slides[page];$('chapter').textContent=s.chapter;$('title').textContent=s.title;$('title').style.whiteSpace='pre-line';$('lead').textContent=s.lead;$('ref-title').textContent=s.ref;$('points').replaceChildren(...s.points.map(t=>{const d=document.createElement('div');d.className='point';d.textContent=t;return d}));const cards=s.cards.map(makeCard);if(s.rows){const row=document.createElement('div');row.className='row';row.append(...cards);$('visual').replaceChildren(row)}else $('visual').replaceChildren(...cards);$('status').textContent=s.status||'';$('source').textContent='문서 근거: '+s.source;$('page').textContent=String(page+1).padStart(2,'0')+' / '+slides.length;$('counter').textContent=(page+1)+' / '+slides.length;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('announce').textContent=(page+1)+'번 슬라이드. '+s.title;history.replaceState(null,'','#'+(page+1));}
    function move(n){page=Math.max(0,Math.min(slides.length-1,page+n));render()}
    function mode(){wide=!wide;$('stage').classList.toggle('wide',wide);$('mode').textContent=wide?'분할 보기 · S':'전체 폭 · S';$('mode').setAttribute('aria-pressed',String(wide))}
    async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('announce').textContent='브라우저 전체 화면 버튼을 사용해 주세요.'}}
    function resize(){const scale=Math.min(innerWidth/2560,Math.max(1,innerHeight-90)/720);$('stage').style.transform='translate(-50%,-50%) scale('+scale+')'}
    $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('mode').onclick=mode;$('fullscreen').onclick=fullscreen;
    addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}else if(e.key.toLowerCase()==='s')mode();else if(e.key.toLowerCase()==='f')fullscreen()});
    addEventListener('resize',resize);addEventListener('hashchange',()=>{page=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1));render()});render();resize();
  </script>
</body>
</html>
