      summary:`<svg class="artwork" viewBox="0 0 1200 420" role="img" aria-label="Q&A 통합 플랫폼 도입으로 기대하는 세 가지 업무 개선: 문의를 한곳에서 확인, 담당과 상태 공유, 답변과 개발 작업 연결"><g transform="translate(0,-40)"><rect x="18" y="58" width="366" height="330" rx="22" class="art-box"/><circle cx="201" cy="140" r="48" fill="#263a51" stroke="#83a8d0" stroke-width="3"/><rect x="177" y="117" width="48" height="48" rx="6" fill="none" stroke="#b7cce4" stroke-width="4"/><path d="M187 130h27m-27 12h27m-27 12h18" stroke="#80dfad" stroke-width="4" stroke-linecap="round"/><text x="201" y="235" text-anchor="middle" class="art-title">문의 한곳에서 확인</text><text x="201" y="283" text-anchor="middle" class="art-small">서비스가 달라도</text><text x="201" y="317" text-anchor="middle" class="art-small">관리 화면은 하나</text><rect x="417" y="58" width="366" height="330" rx="22" class="art-box-green"/><circle cx="600" cy="140" r="48" fill="#102b25" stroke="#7ce2ad" stroke-width="3"/><circle cx="588" cy="132" r="10" fill="#a6f3c9"/><path d="M569 159c2-15 34-15 37 0" fill="none" stroke="#a6f3c9" stroke-width="4" stroke-linecap="round"/><rect x="614" y="119" width="28" height="42" rx="7" fill="#294d40" stroke="#80dfad" stroke-width="3"/><path d="M621 132h14m-14 9h14m-14 9h9" stroke="#a6f3c9" stroke-width="3" stroke-linecap="round"/><text x="600" y="235" text-anchor="middle" class="art-title">담당·상태 확인</text><text x="600" y="283" text-anchor="middle" class="art-small">누가 처리 중인지</text><text x="600" y="317" text-anchor="middle" class="art-small">진행 상황을 함께 확인</text><rect x="816" y="58" width="366" height="330" rx="22" class="art-box"/><circle cx="999" cy="140" r="48" fill="#263a51" stroke="#83a8d0" stroke-width="3"/><rect x="963" y="122" width="35" height="31" rx="6" fill="none" stroke="#b7cce4" stroke-width="3"/><path d="m968 130 12 9 13-9" fill="none" stroke="#80dfad" stroke-width="3"/><path d="M1007 138h24" stroke="#80dfad" stroke-width="4" stroke-linecap="round"/><path d="m1023 130 9 8-9 8" fill="none" stroke="#80dfad" stroke-width="3"/><     };
    function makeArtwork(type){const wrap=document.createElement('div');wrap.className='artwork-wrap';wrap.dataset.art=type;wrap.innerHTML=artwork[type]||'';return wrap}
    function makeScreenshots(s){
      const board=document.createElement('div');board.className='screenshot-board';
      const row=document.createElement('div');row.className='screenshot-row '+(s.screenshots.length>2?'triple':s.screenshots.length>1?'dual':'single');
      s.screenshots.forEach((item,i)=>{
        if(i&&!s.noScreenshotArrows){const arrow=document.createElement('span');arrow.className='screenshot-arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');row.append(arrow)}
        const figure=document.createElement('figure');figure.className='screenshot-figure';
        const img=document.createElement('img');img.src=item.src;img.alt=item.label;img.loading='eager';
        if(item.videoLink){img.classList.add('video-link');img.tabIndex=0;img.setAttribute('role','button');img.title='클릭하면 시연 영상 창이 열립니다';const open=()=>openVideoWindow(item.videoLink);img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})}
        else if(item.zoom){img.classList.add('zoomable');img.tabIndex=0;img.setAttribute('role','button');img.title='클릭하면 확대';const open=()=>openImageZoom(item.src,item.label);img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})}
        const caption=document.createElement('figcaption');caption.textContent=item.label;
        figure.append(img,caption);row.append(figure);
      });
      board.append(row);
      if(s.screenshotFlow){
        const flow=document.createElement('div');flow.className='screenshot-flow';
        s.screenshotFlow.forEach((label,i)=>{if(i){const sep=document.createElement('span');sep.className='sep';sep.textContent='→';flow.append(sep)}const item=document.createElement('strong');item.textContent=label;flow.append(item)});
        board.append(flow);
      }
      return board;
    }
    function openVideoWindow(src){
      const target=screenDetails?.currentScreen||{left:screen.availLeft??screenX,top:screen.availTop??screenY,width:screen.availWidth||screen.width,height:screen.availHeight||screen.height};
      const url=new URL('video-player.html',location.href);url.searchParams.set('src',new URL(src,location.href).href);
      const features='popup,width='+Math.round(target.width)+',height='+Math.round(target.height)+',left='+Math.round(target.left)+',top='+Math.round(target.top)+',resizable=yes,scrollbars=no';
      const player=window.open(url.href,'qna-demo-video',features);
      if(player){player.focus();setTimeout(()=>{try{player.moveTo(target.left,target.top);player.resizeTo(target.width,target.height)}catch{}},250)}
    }
    function openImageZoom(src,alt){
      const overlay=document.createElement('div');overlay.className='image-zoom';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label',alt+' 확대 화면');
      const image=document.createElement('img');image.src=src;image.alt=alt;
      const close=document.createElement('button');close.type='button';close.textContent='닫기 ×';close.setAttribute('aria-label','확대 화면 닫기');
      const dismiss=()=>{overlay.remove();removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key==='Escape')dismiss()};
      overlay.addEventListener('click',e=>{if(e.target===overlay)dismiss()});close.addEventListener('click',dismiss);overlay.append(image,close);document.body.append(overlay);addEventListener('keydown',onKey);close.focus();
    }
    function makeLeftDiagram(lanes){
      const fragment=document.createDocumentFragment();
      lanes.forEach(lane=>{
        const row=document.createElement('div');row.className='left-lane';
        const label=document.createElement('div');label.className='left-lane-label';label.textContent=lane.label;row.append(label);
        const flow=document.createElement('div');flow.className='left-lane-flow';
        lane.steps.forEach((step,index)=>{
          if(index){const arrow=document.createElement('span');arrow.className='left-node-arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');flow.append(arrow)}
          const node=document.createElement('div');node.className='left-node '+(step[1]||'');node.textContent=step[0];flow.append(node);
        });
        row.append(flow);fragment.append(row);
      });
      return fragment;
    }
    function makeCard(data){const div=document.createElement('div');div.className='card '+(data[2]||'');const strong=document.createElement('strong');strong.textContent=data[0];const p=document.createElement('p');p.textContent=data[1];div.append(strong,p);return div}
    function makeFlow(s){
      const list=document.createElement('ol');list.className='flow'+(s.flow.length>4?' detailed':'');list.setAttribute('aria-label','왼쪽에서 오른쪽으로 이어지는 처리 흐름');
      s.flow.forEach((item,i)=>{
        if(i){const arrow=document.createElement('li');arrow.className='flow-arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');list.append(arrow)}
        const step=document.createElement('li');step.className='flow-step '+(item[3]||'');
        const role=document.createElement('span');role.className='flow-role';role.textContent=item[0];
        const title=document.createElement('strong');title.textContent=item[1];
        const detail=document.createElement('p');detail.textContent=item[2];step.append(role,title,detail);list.append(step);
      });
      $('visual').replaceChildren(list);
      if(s.branch){const branch=document.createElement('div');branch.className='flow-branch';branch.textContent=s.branch;$('visual').append(branch)}
    }
    function render(){const s=slides[page];$('stage').classList.toggle('diagram',Boolean(s.flow||s.systemMap));$('stage').classList.toggle('with-art',Boolean(s.art));$('chapter').textContent=s.chapter||'';$('chapter').hidden=!s.chapter;$('title').textContent=s.title;$('title').style.whiteSpace='nowrap';$('lead').textContent=s.lead||'';$('lead').hidden=Boolean(s.hideLead);const leftDiagram=$('left-diagram');leftDiagram.replaceChildren();leftDiagram.hidden=!s.leftDiagram;if(s.leftDiagram)leftDiagram.append(makeLeftDiagram(s.leftDiagram));const leftArt=$('left-art');leftArt.replaceChildren();leftArt.hidden=!s.leftArt;leftArt.classList.toggle('compact',Boolean(s.leftArtCompact));if(s.leftArt)leftArt.append(makeArtwork(s.leftArt));const leftCards=$('left-cards');leftCards.replaceChildren();leftCards.hidden=!s.leftCards;if(s.leftCards)leftCards.append(...s.leftCards.map(makeCard));$('ref-title').textContent=s.ref;$('points').replaceChildren(...s.points.map(t=>{const d=document.createElement('div');d.className='point';d.textContent=t;return d}));$('visual').classList.toggle('has-art',Boolean(s.art));if(s.screenshots){$('visual').replaceChildren(makeScreenshots(s))}else if(s.art){$('visual').replaceChildren(makeArtwork(s.art))}else{const cards=s.cards.map(makeCard);if(s.rows){const row=document.createElement('div');row.className='row';row.append(...cards);$('visual').replaceChildren(row)}else $('visual').replaceChildren(...cards);if(s.flow)makeFlow(s)}$('status').textContent=s.status||'';$('source').textContent='문서 근거: '+s.source;$('page').textContent=String(displayMode==='visual'?page+1:page+2).padStart(2,'0')+' / '+(slides.length+1);$('counter').textContent=(displayMode==='visual'?page+1:coverVisible?1:page+2)+' / '+(slides.length+1);$('prev').disabled=coverVisible;$('next').disabled=!coverVisible&&page===slides.length-1;$('announce').textContent=(page+1)+'번 슬라이드. '+s.title;if(location.protocol!=='file:'){try{history.replaceState(null,'','#'+(displayMode==='visual'?page+1:coverVisible?1:page+2))}catch{}}}
    function setPage(next){const previous=page;page=Math.max(0,Math.min(slides.length-1,next));if(visualWindow&&!visualWindow.closed&&(page!==previous||slides[page].noVisual)){visualWindow.close();visualWindow=null}render()}
    function move(n){
      if(displayMode==='visual'){setPage(page+n);return}
      if(coverVisible){if(n>0){coverVisible=false;$('cover').hidden=true;$('stage').hidden=false;render();requestScreenDetails();if(!document.fullscreenElement)fullscreen()}return}
      if(page===0&&n<0){if(visualWindow&&!visualWindow.closed)visualWindow.close();visualWindow=null;coverVisible=true;$('cover').hidden=false;$('stage').hidden=true;render();return}
      setPage(page+n)
    }
    async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('announce').textContent='브라우저 전체 화면 버튼을 사용해 주세요.'}}
    function resize(){const reserved=displayMode==='visual'||document.fullscreenElement?0:90;const scale=Math.min(innerWidth/1280,Math.max(1,innerHeight-reserved)/720);$('stage').style.transform='translate(-50%,-50%) scale('+scale+')'}
    function requestScreenDetails(){
      if(screenDetailsPromise)return screenDetailsPromise;
      if(!('getScreenDetails'in window)){screenDetailsResolved=true;screenDetailsPromise=Promise.resolve(null);return screenDetailsPromise}
      try{screenDetailsPromise=window.getScreenDetails().then(details=>{screenDetails=details;screenDetailsResolved=true;return details}).catch(()=>{screenDetailsResolved=true;return null})}catch{screenDetailsResolved=true;screenDetailsPromise=Promise.resolve(null)}
      return screenDetailsPromise;
    }
    function rightScreen(details){const current=details.currentScreen;const screens=details.screens;const currentMatch=screens.find(s=>s.left===current.left&&s.top===current.top)||current;const other=screens.filter(s=>s.left!==currentMatch.left||s.top!==currentMatch.top);return other.filter(s=>s.left>=currentMatch.left+currentMatch.width).sort((a,b)=>a.left-b.left)[0]||null}
    function screenSummary(details){const current=details.currentScreen;return '현재 화면 ('+current.left+','+current.top+') '+current.width+'×'+current.height+' · 연결 화면 '+details.screens.map((s,i)=>(i+1)+':('+s.left+','+s.top+') '+s.width+'×'+s.height).join(' | ')}
    function placeVisualWindow(win,target){
      const x=target.left;const y=target.top;const w=target.width;const h=target.height;
      $('mode-hint').textContent='오른쪽 모니터 전체 화면 요청 · 좌표 ('+x+','+y+') · '+w+'×'+h+' CSS 픽셀';
      const requestPlacement=(delegateFullscreen=false)=>{if(!win||win.closed)return;try{const message={type:'qna-index3-place-window',x,y,width:w,height:h};if(delegateFullscreen)win.postMessage(message,{targetOrigin:location.origin,delegate:'fullscreen'});else win.postMessage(message,'*');win.focus()}catch{try{win.postMessage({type:'qna-index3-place-window',x,y,width:w,height:h},'*')}catch{}}};
      requestPlacement(true);
      setTimeout(()=>requestPlacement(false),250);setTimeout(()=>{requestPlacement(false);try{win.postMessage({type:'qna-index3-report-position'},'*')}catch{}},800);setTimeout(()=>{try{if(!win.closed)win.postMessage({type:'qna-index3-report-position'},'*')}catch{}},1400);
      setTimeout(()=>{if(win&&!win.closed)$('mode-hint').textContent='창 위치 확인 응답 대기 중 · 목표 좌표 ('+x+','+y+') · 참고 창이 열린 상태인지 확인해 주세요'},1800);
    }
    function showVisual(){
      if(displayMode==='visual'||coverVisible||slides[page].noVisual)return;
      $('mode-hint').textContent='텍스트 클릭 감지 · 오른쪽 모니터와 참고 창 상태 확인 중';
      if(visualWindow&&!visualWindow.closed){
        visualWindow.postMessage({type:'qna-index3-show-visual',page},'*');
        const currentTarget=screenDetails&&rightScreen(screenDetails);
        if(currentTarget){visualTarget=currentTarget;placeVisualWindow(visualWindow,currentTarget);return}
        requestScreenDetails().then(details=>{
          if(!details||!visualWindow||visualWindow.closed){$('mode-hint').textContent='화면 배치 정보를 읽지 못했습니다 · Chrome 화면 관리 권한과 연결된 모니터를 확인해 주세요';return}
          const target=rightScreen(details);
          if(!target){$('mode-hint').textContent='오른쪽 모니터를 찾지 못했습니다 · '+screenSummary(details);return}
          visualTarget=target;
          $('mode-hint').textContent='오른쪽 모니터 확인 · 시작 좌표 ('+target.left+','+target.top+') · 화면 크기 '+target.width+'×'+target.height;
          placeVisualWindow(visualWindow,target);
        });
        return;
      }
      if(screenDetailsResolved&&!screenDetails){$('mode-hint').textContent='화면 관리 권한을 허용하지 않았습니다 · Chrome 사이트 권한에서 허용한 뒤 페이지를 새로고침해 주세요';return}
      const detailsPromise=requestScreenDetails();
      const url=new URL(location.href);url.searchParams.set('display','visual');url.searchParams.set('windowVersion','20260929-2');url.hash=String(page+1);
      const target=screenDetails&&rightScreen(screenDetails);
      if(screenDetailsResolved&&screenDetails&&!target){$('mode-hint').textContent='오른쪽 모니터를 찾지 못했습니다 · '+screenSummary(screenDetails);return}
      const targetLeft=target?target.left:0;
      const targetTop=target?target.top:0;
      const targetWidth=target?target.width:1280;
      const targetHeight=target?target.height:720;
      visualTarget=target;
      const features='popup,width='+targetWidth+',height='+targetHeight+',left='+targetLeft+',top='+targetTop;
      visualWindow=window.open(url.href,visualWindowName,features);
      if(!visualWindow){$('mode-hint').textContent='참고 화면 팝업이 차단됨 · 브라우저에서 팝업 허용 후 텍스트를 다시 클릭';return}
      visualWindow.focus();
      if(target)placeVisualWindow(visualWindow,target);
      detailsPromise.then(details=>{
        if(!visualWindow||visualWindow.closed)return;
        if(!details){visualWindow.close();visualWindow=null;$('mode-hint').textContent='모니터 배치가 허용되지 않음 · Chrome의 화면 관리 권한을 허용해 주세요';return}
        const target=rightScreen(details);
        if(!target){visualWindow.close();visualWindow=null;$('mode-hint').textContent='오른쪽 모니터를 찾지 못했습니다 · '+screenSummary(details);return}
        visualTarget=target;
        $('mode-hint').textContent='오른쪽 모니터 전체 화면 요청 · '+target.width+'×'+target.height+' CSS 픽셀';
        placeVisualWindow(visualWindow,target);
      });
    }
    $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('fullscreen').onclick=fullscreen;
    addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key.toLowerCase()==='f'){fullscreen();return}if(displayMode==='visual')return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}});
    $('stage').querySelector('.narrative').addEventListener('click',()=>{if(displayMode!=='visual')showVisual()});
    addEventListener('message',e=>{
      const data=e.data;
      if(displayMode==='visual'&&data&&data.type==='qna-index3-show-visual'&&Number.isInteger(data.page))setPage(data.page);
      if(displayMode==='visual'&&data&&data.type==='qna-index3-place-window'){
        try{
          window.moveTo(data.x,data.y);window.resizeTo(data.width,data.height);
          if(!document.fullscreenElement){const details=screenDetails;const target=details?.screens.find(s=>s.left===data.x&&s.top===data.y);const full=target?document.documentElement.requestFullscreen({screen:target}):document.documentElement.requestFullscreen();full.then(()=>{resize();reportVisualPosition()}).catch(error=>{if(window.opener)window.opener.postMessage({type:'qna-index3-fullscreen-error',message:String(error)},'*')})}
          setTimeout(reportVisualPosition,700);
        }catch(error){if(window.opener)window.opener.postMessage({type:'qna-index3-placement-error',message:String(error)},'*')}
      }
      if(displayMode==='visual'&&data&&data.type==='qna-index3-report-position')reportVisualPosition();
      if(displayMode!=='visual'&&visualWindow&&e.source===visualWindow&&data&&data.type==='qna-index3-placement-error')$('mode-hint').textContent='참고 창 이동 실패 · '+data.message;
      if(displayMode!=='visual'&&visualWindow&&e.source===visualWindow&&data&&data.type==='qna-index3-fullscreen-error')$('mode-hint').textContent='전체 화면 요청 실패 · '+data.message+' · 창에서 F 키를 눌러 주세요';
      if(displayMode!=='visual'&&visualWindow&&e.source===visualWindow&&data&&data.type==='qna-index3-position'){
        const target=visualTarget;const tx=target?.left??0;const ty=target?.top??0;const tw=target?.width??0;const th=target?.height??0;
        const onTarget=target&&data.x>=tx-80&&data.x<tx+tw&&data.y>=ty-80&&data.y<ty+th;
        $('mode-hint').textContent='참고 창 실제 '+data.physicalWidth+'×'+data.physicalHeight+' · 목표 '+(tw*target?.devicePixelRatio||0)+'×'+(th*target?.devicePixelRatio||0)+' · '+(data.fullscreen?'전체 화면':'창 모드')+(onTarget?' · 오른쪽 모니터':' · 위치 확인 필요');
      }
    });
    function reportVisualPosition(){if(displayMode==='visual'&&window.opener)window.opener.postMessage({type:'qna-index3-position',x:screenX,y:screenY,width:outerWidth,height:outerHeight,fullscreen:Boolean(document.fullscreenElement),physicalWidth:Math.round(screen.width*devicePixelRatio),physicalHeight:Math.round(screen.height*devicePixelRatio)},'*')}
    if(displayMode==='visual'){addEventListener('load',reportVisualPosition);addEventListener('resize',reportVisualPosition);setTimeout(reportVisualPosition,300);setTimeout(reportVisualPosition,1200)}
    addEventListener('resize',resize);
    addEventListener('fullscreenchange',resize);
    addEventListener('hashchange',()=>{const hashPage=parseInt(location.hash.slice(1),10)||1;if(displayMode==='visual'){const next=Math.max(0,Math.min(slides.length-1,hashPage-1));if(next!==page)setPage(next)}else if(hashPage===1){if(!coverVisible)move(-1)}else{const next=Math.max(0,Math.min(slides.length-1,hashPage-2));if(coverVisible){coverVisible=false;$('cover').hidden=true;$('stage').hidden=false;render()}if(next!==page)setPage(next)}});
    render();resize();
    if(displayMode==='visual'){requestScreenDetails();document.getElementById('cover').hidden=true;document.getElementById('stage').hidden=false}
    else{document.getElementById('cover').hidden=!coverVisible;document.getElementById('stage').hidden=coverVisible;document.querySelector('.toolbar').hidden=false}
  </script>
