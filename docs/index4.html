<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>흩어진 요청을 한곳으로 · 알림은 빠르게보다 정확하게</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090d14;color:#edf2f7;font-family:"Pretendard","Malgun Gothic",sans-serif;overflow:hidden}
    button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #a6f3c9;outline-offset:5px}
    .toolbar{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;background:#151d2aef;border:1px solid #344153;border-radius:12px;white-space:nowrap;font-size:13px}
    .toolbar button{background:#263247;border:0;padding:9px 13px;border-radius:6px}.toolbar button:hover{background:#3c506c}.toolbar button:disabled{opacity:.3;cursor:default}.toolbar span{padding:0 8px;color:#abb9cb}
    #stage{width:2560px;height:720px;position:absolute;top:50%;left:50%;transform-origin:center;display:grid;grid-template-columns:1fr 1fr;background:#0f1722;overflow:hidden}
    .narrative{padding:66px 78px;position:relative;display:flex;flex-direction:column;border-right:1px solid #344052}
    .eyebrow{color:#9bf0c0;font-size:17px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.kicker{color:#8e9bb0;font-size:18px;margin-top:28px}
    h1{font-size:61px;line-height:1.23;letter-spacing:-2.8px;margin:19px 0 25px;word-break:keep-all;font-weight:750;max-width:1080px}
    .lead{font-size:30px;line-height:1.6;white-space:pre-line;color:#c1cddd;max-width:1000px;word-break:keep-all;margin:0}
    .points{display:flex;gap:20px;margin-top:auto;padding-top:30px}.point{flex:1;border-top:2px solid #435168;padding-top:16px;font-size:20px;line-height:1.5;word-break:keep-all;color:#aebdd1}
    .footer{display:flex;justify-content:space-between;color:#697a90;font-size:14px;margin-top:35px;letter-spacing:.3px}
    .reference{background:#141f2e;padding:52px 70px;display:flex;flex-direction:column}.ref-label{font-size:15px;letter-spacing:2px;color:#9badc3;margin-bottom:14px}.ref-title{font-size:32px;font-weight:700;margin:0 0 24px;letter-spacing:-1px}.visual{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
    .card{border:1px solid #35465c;background:#1c2b3e;padding:15px 22px;border-radius:12px}.card strong{display:block;font-size:25px;font-weight:650;margin-bottom:6px;color:#e6edf6}.card p{font-size:19px;line-height:1.5;color:#afc0d5;margin:0;word-break:keep-all}.card.accent{border-color:#72d6a2;background:#193831}.card.accent strong{color:#a6f3c9}.card.warn{border-color:#bb9a63}.card.warn strong{color:#efd096}
    .row{display:flex;align-items:stretch;gap:14px}.row .card{flex:1;min-width:0}.arrow{color:#78d8a4;align-self:center;font-size:30px}.source{display:none;color:#8494a9;font-size:13px;line-height:1.4;margin-top:16px;overflow-wrap:anywhere}.status{color:#e5c78f;font-size:15px;line-height:1.4;margin-top:12px}
    #stage.wide{grid-template-columns:1.15fr 1fr}#stage.wide .narrative{border-right:0;padding-right:90px}#stage.wide .reference{background:transparent;padding-left:20px}#stage.wide h1{font-size:74px;max-width:1170px}#stage.wide .ref-label{visibility:hidden}
    .mode-hint{position:fixed;top:16px;left:22px;font-size:12px;color:#687a91}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    /* Full-width diagrams keep the process readable across the presentation screen. */
    h1{padding-bottom:8px}.point{font-size:25px}.card strong{font-size:34px}.card p{font-size:26px}.ref-title{font-size:38px}.status{font-size:20px}
    #stage.diagram{display:flex;flex-direction:column;padding:38px 70px 30px;gap:22px}
    #stage.diagram .narrative{padding:0;border:0;display:grid;grid-template-columns:1fr auto;gap:10px 30px;flex:none}
    #stage.diagram .eyebrow{display:none}#stage.diagram .kicker{margin:0;font-size:23px;grid-column:1}
    #stage.diagram h1{font-size:66px;line-height:1.15;max-width:none;margin:0;grid-column:1;letter-spacing:-2px}
    #stage.diagram .lead{font-size:30px;max-width:none;grid-column:1;line-height:1.4}
    #stage.diagram .points{display:none}#stage.diagram .footer{grid-column:2;grid-row:1;margin:0;font-size:20px;align-self:start}
    #stage.diagram .footer span:first-child{display:none}
    #stage.diagram .reference{padding:0;background:transparent;flex:1;min-height:0}
    #stage.diagram .ref-label,#stage.diagram .ref-title{display:none}
    #stage.diagram .visual{gap:20px;min-height:0;justify-content:center}
    #stage.diagram .status{font-size:22px;margin-top:12px;color:#b3c1d1}
    .flow{display:flex;align-items:stretch;gap:16px;width:100%;margin:0;padding:0;list-style:none}
    .flow-step{flex:1;min-width:0;border:2px solid #40546d;border-radius:20px;background:#1b2a3d;padding:30px 24px;display:flex;flex-direction:column;justify-content:center;gap:16px}
    .flow-step.accent{background:#183c33;border-color:#7ce2ad}
    .flow-role{font-size:25px;color:#a9bbd0;letter-spacing:1px}.flow-step.accent .flow-role{color:#a6efc8}
    .flow-step strong{font-size:62px;line-height:1.2;letter-spacing:-2px;word-break:keep-all}
    .flow-step p{font-size:31px;line-height:1.45;color:#c4d1e0;white-space:pre-line;margin:0;word-break:keep-all}
    .flow-arrow{display:flex;align-items:center;font-size:54px;color:#80dfad;flex:none}
    .flow.detailed .flow-step{padding:28px 20px}.flow.detailed strong{font-size:48px}.flow.detailed p{font-size:28px}
    .flow-branch{width:calc((100% - 320px) / 6 * 3 + 128px);margin-left:calc((100% - 320px) / 6 * 2 + 128px);border:2px solid #88a9d0;border-top:0;border-radius:0 0 16px 16px;text-align:center;padding:14px 12px;font-size:28px;color:#cfdef0}
    .system-map{display:block;width:100%;height:auto;max-height:410px;overflow:visible}
    .system-map text{font-family:"Pretendard","Malgun Gothic",sans-serif;fill:#edf2f7}
    .system-map .map-role{font-size:29px;fill:#b9cce2}.system-map .map-title{font-size:46px;font-weight:700;letter-spacing:-1px}
    .system-map .map-detail{font-size:29px;fill:#c4d1e0}.system-map .map-label{font-size:28px;fill:#a6efc8}
    .system-map .map-node{fill:#1b2a3d;stroke:#49617e;stroke-width:2}.system-map .map-hub{fill:#183c33;stroke:#7ce2ad;stroke-width:3}
    .system-map .map-link{fill:none;stroke:#85dcb0;stroke-width:3;marker-start:url(#map-arrow);marker-end:url(#map-arrow)}
    @media(max-width:650px){.toolbar{font-size:11px;gap:4px;padding:6px}.toolbar button{padding:8px}.toolbar span{padding:0 3px}.mode-hint{font-size:10px}}
    @media print{body{overflow:visible;background:white}#stage{position:static;transform:none!important;width:100%;height:auto;min-height:720px}.toolbar,.mode-hint{display:none}}
  
    [hidden]{display:none!important}
    .cover-screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:8vw;background:radial-gradient(ellipse at 82% 22%,#194735 0,transparent 31%),radial-gradient(ellipse at 8% 95%,#203454 0,transparent 36%),linear-gradient(135deg,#0a101a,#111d2a 64%,#0b141e)}
    .cover-screen:before{content:"";position:absolute;width:42vw;height:42vw;max-height:70vh;max-width:70vh;border:1px solid #5bd39244;border-radius:50%;right:10vw;top:9vh;box-shadow:0 0 0 4vw #5bd39208,0 0 0 9vw #5bd39205;pointer-events:none}
    .cover-content{position:relative;width:min(1800px,100%);z-index:1}.cover-kicker{color:#9bf0c0;font-size:clamp(16px,1.3vw,28px);letter-spacing:.15em;font-weight:700}.cover-title{font-size:clamp(46px,6vw,112px);line-height:1.18;letter-spacing:-.045em;max-width:1450px;margin:34px 0 20px;word-break:keep-all}.cover-subtitle{font-size:clamp(22px,2vw,40px);color:#c1cddd;margin:0 0 54px;word-break:keep-all}.cover-meta{display:flex;align-items:center;gap:22px;color:#a8b8cc;font-size:clamp(18px,1.5vw,30px)}.cover-meta:before{content:"";width:54px;height:2px;background:#77dfa6}.cover-start{display:inline-flex;align-items:center;gap:18px;margin-top:70px;border:1px solid #84e2ad;background:#17392f;color:#c8f7dc;padding:18px 28px;border-radius:999px;font-size:21px;font-weight:700}.cover-start:hover{background:#235741}
  </style>
</head>
<body>
  <section id="cover" class="cover-screen" aria-label="발표 표지">
    <div class="cover-content">
      <div class="cover-kicker">Q&amp;A 통합 관리 플랫폼</div>
      <h1 class="cover-title">흩어진 요청을 한곳으로 :<br>Q&amp;A 통합 플랫폼 구축</h1>
      <p class="cover-subtitle">알림은 빠르게보다 정확하게</p>
      <div class="cover-meta">송대일 선임연구원</div>
      <button class="cover-start" id="cover-start">발표 시작 →</button>
    </div>
  </section>
  <div class="mode-hint" hidden>흩어진 요청을 한곳으로 · 송대일 선임연구원</div>
  <main id="stage" aria-label="세미나 슬라이드" hidden>
    <section class="narrative">
      <div class="eyebrow">Q&A 통합 관리 플랫폼</div>
      <div class="kicker" id="chapter"></div>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="points" id="points"></div>
      <div class="footer"><span>흩어진 요청을 한곳으로 · 송대일 선임연구원</span><span id="page"></span></div>
    </section>
    <aside class="reference" aria-label="설명 도식과 문서 근거">
      <div class="ref-label">그림으로 보는 업무 흐름</div>
      <h2 class="ref-title" id="ref-title"></h2>
      <div class="visual" id="visual"></div>
      <div class="status" id="status"></div>
      <div class="source" id="source"></div>
    </aside>
  </main>
  <nav class="toolbar" aria-label="발표 조작" hidden>
    <button id="prev" aria-label="이전 슬라이드">←</button>
    <span id="counter"></span>
    <button id="next" aria-label="다음 슬라이드">→</button>
    <button id="mode" aria-pressed="false">전체 폭 · S</button>
    <button id="fullscreen">전체 화면 · F</button>
  </nav>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <script>
    const slides = [
  {
    "chapter": "기 · 만들면서 발견한 문제",
    "title": "알림이 두 번 오거나\n엉뚱한 사람에게 간다면?",
    "lead": "외부 서비스는 이벤트를 다시 보낼 수 있고\n한 사람이 여러 역할을 맡을 수도 있었습니다.",
    "ref": "알림은 편리하지만 실수도 전달한다",
    "cards": [
      [
        "재전송",
        "같은 변경 소식이 다시 들어옴"
      ],
      [
        "겹친 역할",
        "담당자이자 관리자면 같은 사람"
      ],
      [
        "잘못된 내용",
        "내부 메모나 비밀 내용이 밖으로 나갈 위험",
        "accent"
      ]
    ],
    "points": [
      "중복 알림",
      "잘못된 수신자",
      "내부 내용 노출"
    ],
    "status": "",
    "source": "Q&A 통합 플랫폼 작업 문서"
  },
  {
    "chapter": "기 · 수신 대상을 다시 정하다",
    "title": "모든 변경을 모두에게 보내지 않기",
    "lead": "누가 알아야 하는 소식인지, 어떤 내용은 보내면 안 되는지\n먼저 업무 기준으로 나눠야 했습니다.",
    "ref": "누구에게 어떤 소식을 보낼까?",
    "cards": [
      [
        "새 문의·상태 변경",
        "담당자와 해당 관리자 등"
      ],
      [
        "공개 답변",
        "문의 작성자에게"
      ],
      [
        "내부 메모",
        "외부 알림 대상에서 제외",
        "accent"
      ]
    ],
    "points": [
      "이벤트별 수신자",
      "역할 중복 제거",
      "공개 범위 구분"
    ],
    "status": "",
    "source": "Q&A 통합 플랫폼 작업 문서"
  },
  {
    "chapter": "승 · 해결 방향",
    "title": "같은 소식은 한 번, 맞는 사람에게",
    "lead": "이벤트와 수신자를 기준으로 중복 발송을 막고\n프로젝트와 담당 정보에 맞는 대상만 고르도록 했습니다.",
    "ref": "알림 발송 전에 확인",
    "cards": [
      [
        "중복 확인",
        "같은 이벤트·같은 사람은 한 번만"
      ],
      [
        "수신자 결정",
        "맡은 프로젝트와 담당 관계 확인",
        "accent"
      ],
      [
        "비밀 보호",
        "비밀 문의는 상세 내용을 메시지에 싣지 않음"
      ]
    ],
    "points": [
      "이벤트 확인",
      "수신자 확인",
      "내용 범위 확인"
    ],
    "status": "",
    "source": "Q&A 통합 플랫폼 작업 문서"
  },
  {
    "chapter": "전 · 구현하며 챙긴 예외",
    "title": "알림 실패가 문의 기록까지 망치지 않도록",
    "lead": "소식을 보내는 과정에 문제가 나도\n접수한 기록을 잃지 않고 다시 확인할 수 있어야 했습니다.",
    "ref": "보내기와 접수는 별도로 기록",
    "cards": [
      [
        "접수",
        "변경 소식을 먼저 기록"
      ],
      [
        "발송",
        "성공·실패·재시도 상태 보관",
        "accent"
      ],
      [
        "재전달",
        "같은 이벤트를 다시 보내도 중복 방지"
      ]
    ],
    "points": [
      "기록 보존",
      "다시 시도할 수 있게",
      "중복 발송은 방지"
    ],
    "status": "핵심 알림 흐름은 로컬 검증 기록이 있으며, 외부 실발송은 운영 설정 후 확인이 필요합니다.",
    "source": "Q&A 통합 플랫폼 작업 문서"
  },
  {
    "chapter": "결 · 만들며 배운 기준",
    "title": "알림의 성공은 “보냈다”가 아닙니다",
    "lead": "필요한 사람에게 필요한 내용만 한 번 전달되고\n실패했을 때 확인할 길까지 있어야 합니다.",
    "ref": "이번 작업의 교훈",
    "cards": [
      [
        "정확한 대상",
        "프로젝트와 역할 확인"
      ],
      [
        "안전한 내용",
        "내부 메모·비밀 내용 보호",
        "accent"
      ],
      [
        "확인 가능한 결과",
        "실패 이력과 재시도 관리"
      ]
    ],
    "points": [
      "한 번만",
      "맞는 사람에게",
      "공개해도 되는 내용만"
    ],
    "status": "",
    "source": "Q&A 통합 플랫폼 작업 문서"
  }
];
    const $=id=>document.getElementById(id);
    let page=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1));
    let wide=false;
    function makeCard(data){const div=document.createElement('div');div.className='card '+(data[2]||'');const strong=document.createElement('strong');strong.textContent=data[0];const p=document.createElement('p');p.textContent=data[1];div.append(strong,p);return div}
    function makeFlow(s){
      const list=document.createElement('ol');list.className='flow'+(s.flow.length>4?' detailed':'');list.setAttribute('aria-label','왼쪽에서 오른쪽으로 이어지는 처리 흐름');
      s.flow.forEach((item,i)=>{
        if(i){const arrow=document.createElement('li');arrow.className='flow-arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');list.append(arrow)}
        const step=document.createElement('li');step.className='flow-step '+(item[3]||'');
        const role=document.createElement('span');role.className='flow-role';role.textContent=item[0];
        const title=document.createElement('strong');title.textContent=item[1];
        const detail=document.createElement('p');detail.textContent=item[2];step.append(role,title,detail);list.append(step);
      });
      $('visual').replaceChildren(list);
      if(s.branch){const branch=document.createElement('div');branch.className='flow-branch';branch.textContent=s.branch;$('visual').append(branch)}
    }
    function render(){const s=slides[page];$('stage').classList.toggle('diagram',Boolean(s.flow||s.systemMap));$('chapter').textContent=s.chapter;$('title').textContent=s.title;$('title').style.whiteSpace=(s.flow||s.systemMap)?'normal':'pre-line';$('lead').textContent=s.lead;$('ref-title').textContent=s.ref;$('points').replaceChildren(...s.points.map(t=>{const d=document.createElement('div');d.className='point';d.textContent=t;return d}));const cards=s.cards.map(makeCard);if(s.rows){const row=document.createElement('div');row.className='row';row.append(...cards);$('visual').replaceChildren(row)}else $('visual').replaceChildren(...cards);if(s.flow)makeFlow(s);if(s.systemMap)makeSystemMap();$('status').textContent=s.status||'';$('source').textContent='문서 근거: '+s.source;$('page').textContent=String(page+1).padStart(2,'0')+' / '+slides.length;$('counter').textContent=(page+1)+' / '+slides.length;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('announce').textContent=(page+1)+'번 슬라이드. '+s.title;history.replaceState(null,'','#'+(page+1));}
    function move(n){page=Math.max(0,Math.min(slides.length-1,page+n));render()}
    function mode(){wide=!wide;$('stage').classList.toggle('wide',wide);$('mode').textContent=wide?'분할 보기 · S':'전체 폭 · S';$('mode').setAttribute('aria-pressed',String(wide))}
    async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('announce').textContent='브라우저 전체 화면 버튼을 사용해 주세요.'}}
    function resize(){const scale=Math.min(innerWidth/2560,Math.max(1,innerHeight-90)/720);$('stage').style.transform='translate(-50%,-50%) scale('+scale+')'}
    $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('mode').onclick=mode;$('fullscreen').onclick=fullscreen;
    addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}else if(e.key.toLowerCase()==='s')mode();else if(e.key.toLowerCase()==='f')fullscreen()});
    $('cover-start').onclick=()=>{$('cover').hidden=true;$('stage').hidden=false;document.querySelector('.toolbar').hidden=false;document.querySelector('.mode-hint').hidden=false;resize();$('next').focus()};
    addEventListener('resize',resize);addEventListener('hashchange',()=>{page=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1),10)||1)-1));render()});render();resize();
  </script>
</body>
</html>
